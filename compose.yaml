
services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: biblioteca_app

    ports:
      - "8080:80"

    volumes:
      - .:/var/www/html

    environment:
      DATABASE_URL: "postgresql://biblioteca:biblioteca@database:5432/biblioteca?serverVersion=17&charset=utf8"

    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:17

    container_name: biblioteca_database

    restart: unless-stopped

    environment:
      POSTGRES_DB: biblioteca
      POSTGRES_USER: biblioteca
      POSTGRES_PASSWORD: biblioteca

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblioteca -d biblioteca"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
